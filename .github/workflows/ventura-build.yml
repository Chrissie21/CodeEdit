name: Build for Ventura testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check Intel app
        run: bash .github/scripts/build_ventura.sh "$RUNNER_TEMP/ventura-artifacts"

      - name: Upload app and verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodeEdit-Ventura-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/ventura-artifacts
          if-no-files-found: error
          retention-days: 7
